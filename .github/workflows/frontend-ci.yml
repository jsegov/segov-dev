name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter frontend format:check

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Unit tests
        run: pnpm --filter frontend test

      - name: Build
        run: pnpm --filter frontend build

      - name: AMA live evals
        id: ama-evals
        if: ${{ env.AI_GATEWAY_API_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          AMA_EVAL_MODEL: ${{ vars.AMA_EVAL_MODEL }}
          AMA_EVAL_PROVIDERS: ${{ vars.AMA_EVAL_PROVIDERS }}
        run: pnpm --filter frontend eval:ama:ci

      - name: Skip AMA live evals
        if: ${{ env.AI_GATEWAY_API_KEY == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "Skipping AMA live evals because AI Gateway credentials are unavailable for this run."

      - name: Upload AMA eval results
        if: ${{ always() && steps.ama-evals.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ama-eval-results
          path: frontend/evals/ama/results/latest.json
          if-no-files-found: ignore
