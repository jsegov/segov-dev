name: Training CI
on:
  push:
    branches: [main, master]
    paths: ['training/**', '.github/workflows/training-ci.yml']
  pull_request:
    paths: ['training/**', '.github/workflows/training-ci.yml']
permissions:
  contents: read
concurrency:
  group: training-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock
      - run: uv sync --project training --frozen --group dev --python 3.12
      - name: Cache public tokenizer before offline tests
        working-directory: training
        run: uv run --no-sync python -c "from tinker_cookbook.tokenizer_utils import get_tokenizer; get_tokenizer('Qwen/Qwen3.5-4B'); get_tokenizer('thinkingmachines/Inkling-Small')"
      - name: Exporter tests
        working-directory: training
        run: node --test export/*.test.mjs
      - name: Dataset, release, and deployment SDK tests (no model calls)
        working-directory: training
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TINKER_API_KEY: ''
        run: uv run --no-sync python -m pytest -q
